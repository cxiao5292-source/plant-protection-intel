<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#174d3a">
<title>全球与植保情报站</title>
<style>
:root{--green:#174d3a;--pale:#eef6f0;--ink:#1e293b;--muted:#64748b}*{box-sizing:border-box}body{margin:0;background:#f5f7f5;color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}.hero{background:linear-gradient(135deg,#123d2e,#28704e);color:white;padding:28px 18px 24px}.wrap{max-width:900px;margin:auto}.eyebrow{font-size:12px;letter-spacing:1.5px;opacity:.8}.hero h1{font-size:28px;margin:6px 0}.hero p{margin:0;color:#dbece0}.meta{font-size:12px;margin-top:14px;opacity:.85}.tools{padding:14px 16px;max-width:900px;margin:auto}.search{width:100%;padding:12px 14px;border:1px solid #d4ddd6;border-radius:12px;font-size:16px;background:white}.tabs{display:flex;gap:8px;overflow:auto;padding:12px 0}.tab{border:1px solid #d8e1da;background:white;border-radius:999px;padding:8px 14px;white-space:nowrap;color:#315344}.tab.active{background:var(--green);color:white;border-color:var(--green)}main{max-width:900px;margin:auto;padding:0 16px 36px}.intro{background:#eaf3ec;border-radius:14px;padding:14px 16px;font-size:14px;color:#345543;margin-bottom:16px}.section-head{display:flex;justify-content:space-between;align-items:center;margin:18px 0 10px}.section-head h2{font-size:19px;margin:0}.cards{display:grid;grid-template-columns:1fr;gap:12px}.item{background:white;border:1px solid #e1e8e2;border-radius:14px;padding:15px}.tag{display:inline-block;background:#eaf3ec;color:#245c40;border-radius:6px;padding:2px 7px;font-size:12px}.item h3{font-size:17px;line-height:1.45;margin:8px 0}.item p{font-size:14px;color:#596b60;margin:6px 0 10px}.item a{color:#176342;text-decoration:none;font-weight:600}.source{font-size:12px;color:#758278}.badge{display:inline-block;border-radius:6px;padding:2px 7px;font-size:11px;font-weight:600;margin-left:6px;vertical-align:middle}.extra{font-size:12px;color:#596b60;margin-top:6px;line-height:1.5}.vdate{color:#758278;margin-left:8px}.vnote{display:block;margin-top:4px;font-size:12px;color:#345543;background:#eaf3ec;border-radius:6px;padding:4px 8px}.empty{background:white;padding:20px;border-radius:12px;color:var(--muted)}footer{text-align:center;color:#718078;padding:25px 16px;font-size:12px}@media(min-width:650px){.cards{grid-template-columns:1fr 1fr}.hero h1{font-size:34px}}
</style>
</head>
<body>
<header class="hero">
  <div class="wrap">
    <div class="eyebrow">DAILY INTELLIGENCE · 2026—2028 CAREER TRACK</div>
    <h1>全球与植保情报站</h1>
    <p>全球新闻 · 植保科研 · 海外签证 · 农化就业</p>
    <div class="meta" id="updated">加载中…</div>
  </div>
</header>
<div class="tools">
  <input class="search" id="search" placeholder="搜索关键词：抗性机制、农药研发、澳洲签证…" aria-label="搜索情报">
  <div class="tabs" id="tabs">
    <button class="tab active" data-cat="all">全部情报</button>
    <button class="tab" data-cat="global">全球动态</button>
    <button class="tab" data-cat="plant">植保科研</button>
    <button class="tab" data-cat="visa">海外签证</button>
    <button class="tab" data-cat="jobs">农化就业</button>
    <button class="tab" data-cat="archive">历史归档</button>
  </div>
</div>
<main>
  <div class="intro">为中国农业大学植物保护硕士（预计 2028 年毕业）整理的每日信息入口。新闻用于线索发现；签证政策请以政府官网为准，招聘须以雇主官网核实，切勿仅凭新闻标题做决定。</div>
  <div class="section-head">
    <h2 id="heading">今日情报</h2>
    <span class="source" id="count">… 条线索</span>
  </div>
  <div id="cards" class="cards"></div>
</main>
<footer>全球与植保情报站 · 自动收集公开 RSS 线索 · 来源等级仅供初筛，不代表已核验 · 签证政策与招聘必须核对官方原文</footer>
<script src="js/app.js"></script>
</body>
</html>
